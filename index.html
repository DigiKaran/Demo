<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Demo</title>
    <style>
      :root {
        --bg-start: #0f172a;
        --bg-end: #1d4ed8;
        --card-bg: rgba(15, 23, 42, 0.78);
        --card-border: rgba(148, 163, 184, 0.25);
        --primary: #60a5fa;
        --primary-dark: #2563eb;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --input-bg: rgba(15, 23, 42, 0.5);
        --shadow: rgba(15, 23, 42, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
        color: var(--text);
      }

      .login-card {
        width: min(90vw, 420px);
        padding: 32px 28px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        box-shadow: 0 24px 50px var(--shadow);
        backdrop-filter: blur(10px);
      }

      .brand {
        text-align: center;
        margin-bottom: 24px;
      }

      .brand-badge {
        width: 62px;
        height: 62px;
        margin: 0 auto 12px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: bold;
        color: white;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
      }

      form {
        margin-top: 24px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 14px 14px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 8px 0 22px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .remember input {
        width: auto;
        margin: 0;
      }

      .forgot {
        color: var(--primary);
        text-decoration: none;
      }

      .login-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(37, 99, 235, 0.35);
      }

      .signup {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .signup a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand">
        <div class="brand-badge">L</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue</p>
      </div>

      <form>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="name@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password" />
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="forgot" href="#">Forgot password?</a>
        </div>

        <button class="login-btn" type="submit">Log In</button>

        <div class="signup">
          Don’t have an account? <a href="#">Create one</a>
        </div>
      </form>
    </main>
  </body>
</html>
